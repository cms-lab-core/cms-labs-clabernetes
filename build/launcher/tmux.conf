# The launcher image's tmux is a single long-lived session shared by every browser session for one
# device, so the defaults here are about surviving reconnects rather than about multiplexing work.
set -g history-limit 10000
set -g mouse on
set -g status off
set -g default-terminal "tmux-256color"
set -g remain-on-exit off
# A terminal is usually left open while an operator reads logs, so key bindings are not remapped
# away from what a device CLI expects.
setw -g mode-keys vi
